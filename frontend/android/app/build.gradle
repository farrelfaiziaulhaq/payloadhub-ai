plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.payloadhub_ai"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // Unique Play Store-style identifier for this academic project.
        applicationId = "id.farrel.payloadhubai"
        // minSdk/targetSdk follow the Flutter SDK defaults (Android 5.0+).
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // The candidate APK for this assignment is signed with the debug
            // keystore so it installs without extra CI secrets. Replace with a
            // private release keystore before any public distribution.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
