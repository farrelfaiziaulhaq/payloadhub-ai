name: payloadhub_ai
description: PayloadHub-AI — deterministic ethical-hacking assistant (Flutter client).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Secure storage (Android Keystore backed)
  flutter_secure_storage: ^9.2.2

  # Networking
  dio: ^5.7.0
  file_picker: ^8.3.7

  # Code highlighting
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0

  # UI helpers
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
